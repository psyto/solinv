[weights]
tvl = 0.35
change_velocity = 0.25
permissionless_surface = 0.25
complexity = 0.15
audit_maturity = 0.30

# `status` field semantics (Day 49 addition):
#   "ready"      — toolchain-reachable + not yet tested at fuzz depth
#   "exhausted"  — toolchain-reachable but already tested clean (no marginal yield)
#   "gated"      — blocked by the build chain (e.g. Wormhole: the source does not build).
#                  Day 61: H1 was our source build of an old solana-program, not
#                  LiteSVM, so Anchor 0.x alone no longer counts as gated.
#   "unverified" — Anchor version / build chain not yet confirmed (default)
#
# Verified by direct evidence in this repo. Unverified entries should
# be promoted to ready/gated only after either a build smoke or a source
# inspection.

[[targets]]
name = "Kamino"
tvl = 1.00
change_velocity = 0.80
permissionless_surface = 0.85
complexity = 0.85
audit_maturity = 0.75
status = "unverified"
note = "Anchor 0.29, solana-program 1.17.18 (repr(C) AccountInfo, so the Day 61 H1 cause does not apply). The harness targets the source build; the mainnet binary rejects its init_reserve account list (AccountNotEnoughKeys). Setup-gated until init_reserve matches the deployed program."

