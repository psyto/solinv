[package]
name = "escrow_clean_fuzz"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
crucible-fuzzer = { git = "https://github.com/asymmetric-research/crucible", tag = "v0.1.0" }
crucible-test-context = { git = "https://github.com/asymmetric-research/crucible", tag = "v0.1.0" }

solinv-fuzz = { path = "../../../../crates/solinv-fuzz" }
solinv-core = { path = "../../../../crates/solinv-core" }

solana-account = "3"
solana-keypair = "3"
solana-pubkey = "3"
solana-instruction = "3.1"
solana-signer = "3"
sha2 = "0.10"

arbitrary = { version = "1", features = ["derive"] }
ctrlc = "3.4"
libafl = { version = "0.15.1", features = ["std", "cli", "prelude"] }
libafl_bolts = { version = "0.15.1", features = ["std"] }
escrow-clean = { path = "../../programs/escrow-clean", features = ["no-entrypoint"] }

[[bin]]
name = "invariant_test"
path = "src/main.rs"

[features]
# Build the account-validation specs from idl/escrow_clean.json.
idl_specs = []
# Every detector in one run — the campaign's scoring pass. On a clean
# target this is expected to find nothing until a mutant breaks something.
invariant_all = []
# Drives actions with no assertions, so sequences are not cut short by a
# violation. Supplies the reachability half of a campaign.
invariant_reachability = []
